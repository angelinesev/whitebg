<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:transparent;
}

.glass{
    width:100%;
    height:100%;

    background:rgba(255,255,255,0.35);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border-radius:24px;

    box-shadow:
        0 8px 32px rgba(0,0,0,0.10),
        inset 0 1px 0 rgba(255,255,255,0.5);

    position:relative;
    overflow:hidden;
}

/* Top highlight */
.glass::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:30%;

    background:linear-gradient(
        to bottom,
        rgba(255,255,255,0.35),
        rgba(255,255,255,0)
    );

    pointer-events:none;
}

/* Side glow */
.glass::after{
    content:"";
    position:absolute;
    top:0;
    left:-50%;
    width:100%;
    height:100%;

    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.15),
        transparent
    );

    transform:skewX(-15deg);

    pointer-events:none;
}

</style>
</head>

<body>

<div class="glass"></div>

</body>
</html>
