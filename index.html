<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:transparent;
}

.glass{
    width:100%;
    height:100%;

    /* Main Glass Layer */
    background:rgba(255,255,255,0.82);

    backdrop-filter:blur(20px) saturate(160%);
    -webkit-backdrop-filter:blur(20px) saturate(160%);

    border:none;

    border-radius:24px;

    box-shadow:
        0 12px 40px rgba(0,0,0,0.10),
        0 4px 12px rgba(0,0,0,0.05);

    position:relative;
    overflow:hidden;
}

/* Top Shine */
.glass::before{
    content:"";
    position:absolute;

    top:0;
    left:0;
    right:0;

    height:35%;

    background:linear-gradient(
        to bottom,
        rgba(255,255,255,0.45),
        rgba(255,255,255,0)
    );

    pointer-events:none;
}

/* Diagonal Premium Reflection */
.glass::after{
    content:"";

    position:absolute;

    top:-50%;
    left:-50%;

    width:200%;
    height:100%;

    transform:rotate(-15deg);

    background:linear-gradient(
        to right,
        rgba(255,255,255,0),
        rgba(255,255,255,0.12),
        rgba(255,255,255,0)
    );

    pointer-events:none;
}

</style>
</head>

<body>

<div class="glass"></div>

</body>
</html>
